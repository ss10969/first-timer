<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Timer • Find your first</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,sans-serif;color:#252827;background:#fffaf1}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:#2921b9;color:white;font-weight:650}button.secondary{background:#eeedff;color:#2921b9}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ff9900;outline-offset:3px}header{background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:22px;padding:16px 5%;flex-wrap:wrap}.brand{font-size:25px;font-weight:900;letter-spacing:-1px;color:#2921b9}.brand span{color:#ff9900}nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}nav button{background:transparent;color:#444}nav button.active{background:#eeedff;color:#2921b9}main{max-width:1160px;margin:auto;padding:32px 24px 65px}.hero{background:#2921b9;color:white;border-radius:22px;padding:40px;position:relative;overflow:hidden}.hero:after{content:'✳';position:absolute;right:30px;top:-55px;font-size:240px;color:#ffffff12;pointer-events:none}h1{font-size:clamp(30px,5vw,52px);line-height:1.05;letter-spacing:-1.8px;margin:12px 0}h2{font-size:27px;letter-spacing:-.6px}h3{margin:5px 0;font-size:21px}.muted,small{color:#666377}.hero p{max-width:550px;color:#f0efff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px}.card{background:white;border:1px solid #e6dfd3;border-radius:16px;padding:20px;margin-bottom:12px}.art{height:120px;border-radius:11px;background:#ffebc5;display:grid;place-items:center;font-size:52px;margin-bottom:15px}.tag{display:inline-block;background:#eeedff;color:#2921b9;padding:4px 9px;border-radius:20px;font-size:12px;margin:3px 4px 3px 0}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}input,select,textarea{border:1px solid #c9c5d7;border-radius:8px;padding:11px;background:white;color:#252827;max-width:100%}input[type=search]{flex:1;min-width:180px}label{display:block;font-weight:650;margin:12px 0 5px}form input,form select,form textarea{width:100%}textarea{min-height:90px}.line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.avatar{width:48px;height:48px;border-radius:50%;background:#ffebc5;display:grid;place-items:center;font-weight:800;color:#2921b9}.notice{background:#fff3dc;border-radius:10px;padding:12px;margin:15px 0}.bubble{background:#eeedff;padding:12px;border-radius:12px;margin:10px 0;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}.mine{margin-left:auto;background:#2921b9;color:white}.demo{font-size:12px;text-align:center;background:#ffebc5;padding:7px}.empty{padding:30px;text-align:center;color:#666377}footer{text-align:center;color:#666377;font-size:12px;padding:20px}a{color:#2921b9} @media(max-width:600px){header{gap:8px;padding:12px}nav{order:3;flex-basis:100%}nav button{padding:8px}.hero{padding:25px}main{padding:18px 14px}.filters>*{flex:1}.card{padding:15px}}
.brand img{display:block;object-fit:contain}.hero{background:#2921b9;padding-right:32%}.hero:after{content:"";background:url("logo-transparent.png") center/contain no-repeat;opacity:1;width:25%;height:90%;right:3%;top:5%}.hero button.secondary{background:#ffb52e;color:#221b65}.tag{font-weight:650} @media(max-width:600px){.hero{padding:25px}.hero:after{display:none}.brand img{width:58px;height:58px}}

/* V3: Orange-first campus identity */
body{background:#fff9ee;color:#25212a}button{background:#ff9900;color:#251b13;border-radius:12px}button:hover{filter:brightness(.95)}button.secondary{background:#fff0d4;color:#2921b9}nav button.active{background:#ffe1a3;color:#2921b9}nav button{color:#45404b}header{border-color:#f2dfc7}.hero{background:#ff9900;color:#2921b9;border-radius:30px;min-height:245px}.hero p{color:#392b38}.hero button.secondary{background:#2921b9;color:white}.hero:after{background-image:url("logo-white.png");transform:rotate(5deg)}.card{border-color:#f0dfcb;border-radius:20px;box-shadow:0 4px 14px #81531c09}.art{background:#ffd36e;border-radius:15px}.card:nth-child(4n+2) .art{background:#ffe3d5}.card:nth-child(4n+3) .art{background:#eeedff}.card:nth-child(4n+4) .art{background:#ffedb9}.tag{background:#fff0d4;color:#754000}.tag:nth-of-type(2){background:#eeedff;color:#2921b9}.avatar{background:#ffd36e}.notice{background:#fff0d4}.bubble{background:#fff0d4}.mine{background:#2921b9;color:white}.demo{background:#ffd36e;color:#392b38}input,select,textarea{border-color:#decdb8}button:focus-visible,a:focus-visible,input:focus-visible{outline-color:#2921b9}h2{color:#2921b9}footer{color:#62574e}

/* V4: plain orange hero, no decorative logo */
.hero{background:#ff9900;padding-right:32%}.hero:after{display:none!important;content:none!important;background:none!important}@media(max-width:600px){.hero{padding-right:25px}}
</style></head><body><header><div class="brand"><img src="logo-white.png" alt="First Timer" width="76" height="76"></div><nav id="nav"></nav><label style="margin:0;font-size:12px">Demo account <select id="role" onchange="switchRole(this.value)"><option>Daniel</option><option>Iris</option></select></label></header><main id="app"></main><footer>First Timer • Team T22udo • A student project, not an official UMD service <button class="secondary" onclick="resetDemo()">Reset demo</button></footer><script>
const seed=[{id:1,title:'Your first Barre class',cat:'Fitness',time:'Thursday',hour:'4:00 PM',place:'Eppley Recreation Center lobby',mode:'Small group',host:'Iris',cap:5,icon:'🩰',desc:'A relaxed introduction to Barre. No experience needed. Wear comfortable clothes and bring water.'},{id:2,title:'Campus photo walk',cat:'Creative',time:'Friday',hour:'3:00 PM',place:'McKeldin Mall',mode:'Small group',host:'Maya',cap:6,icon:'📷',desc:'Explore campus and learn simple photography tips. Phone cameras welcome.'},{id:3,title:'Try coding together',cat:'Learning',time:'Thursday',hour:'5:30 PM',place:'McKeldin Library lobby',mode:'1-on-1',host:'Alex',cap:1,icon:'💻',desc:'A friendly beginner coding session. Bring your laptop.'},{id:4,title:'Explore campus at your pace',cat:'Outdoors',time:'Saturday',hour:'11:00 AM',place:'McKeldin Mall',mode:'Solo',host:'First Timer',cap:20,icon:'🌿',desc:'A self-guided campus walk with a suggested starting point.'}];
let state;try{state=JSON.parse(localStorage.getItem('ft-demo-v1'))}catch(e){}if(!state)state={events:seed,requests:[],messages:[],saved:[],reports:[]};let role='Daniel',page='Explore',selected=1,query='',cat='All',day='All',mode='All';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('ft-demo-v1',JSON.stringify(state))}catch(e){}}function go(p){page=p;render();window.scrollTo(0,0)}function switchRole(r){role=r;go(r==='Iris'?'Host dashboard':'Explore')}function resetDemo(){if(confirm('Reset all simulated activity?')){localStorage.removeItem('ft-demo-v1');location.reload()}}function ev(id){return state.events.find(e=>e.id===id)}function request(id){if(!state.requests.some(r=>r.id===id&&r.user===role)){state.requests.push({id,user:role,status:'Pending'});save()}go('My activities')}function status(id,user,s){let r=state.requests.find(r=>r.id===id&&r.user===user);if(r)r.status=s;save();render()}function detail(id){selected=id;go('Details')}function toggleSave(id){let k=role+':'+id;state.saved=state.saved.includes(k)?state.saved.filter(x=>x!==k):[...state.saved,k];save();render()}function profile(name){selected=name;go('Profile')}function report(name){let reason=prompt('Why are you reporting this profile? (Demo only)');if(reason?.trim()){state.reports.push({name,reason,by:role});save();alert('Demo report recorded. No real moderator has been contacted.')}}function chat(id){selected=id;go('Messages')}function send(e){e.preventDefault();let t=e.target.message.value.trim();if(t){state.messages.push({id:selected,from:role,text:t});save();render()}}function create(e){e.preventDefault();let f=new FormData(e.target);state.events.push({id:Date.now(),title:f.get('title'),cat:f.get('cat'),time:f.get('day'),hour:f.get('hour'),place:f.get('place'),mode:f.get('mode'),host:role,cap:Number(f.get('cap')),icon:'✨',desc:f.get('desc')});save();go('Host dashboard')}
function card(e){return `<article class="card"><div class="art">${e.icon}</div><span class="tag">${esc(e.cat)}</span><span class="tag">Beginner friendly</span><h3>${esc(e.title)}</h3><p class="muted">${esc(e.time)} · ${esc(e.hour)}<br>${esc(e.place)}</p><p>${esc(e.mode)} · Hosted by ${esc(e.host)}</p><div class="line"><button onclick="detail(${e.id})">View activity</button><button class="secondary" onclick="toggleSave(${e.id})" aria-label="Save activity">${state.saved.includes(role+':'+e.id)?'♥ Saved':'♡ Save'}</button></div></article>`}function options(a,v){return a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}function filter(k,v){if(k==='query')query=v;if(k==='cat')cat=v;if(k==='day')day=v;if(k==='mode')mode=v;document.getElementById('results').innerHTML=results()}function results(){let es=state.events.filter(e=>(cat==='All'||e.cat===cat)&&(day==='All'||e.time===day)&&(mode==='All'||e.mode===mode)&&[e.title,e.desc,e.cat,e.host].join(' ').toLowerCase().includes(query.toLowerCase()));return es.length?es.map(card).join(''):'<div class="empty">No matching activities. Try changing your filters.</div>'}
function render(){document.getElementById('role').value=role;document.getElementById('nav').innerHTML=['Explore','Find a buddy','My activities','Messages',...(role==='Iris'?['Host dashboard','Create activity']:[])].map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('');let e=ev(selected);if(page==='Explore'){app.innerHTML=`<section class="hero"><h1>Every first starts<br>somewhere.</h1><p>Hey ${role}! Discover something new, meet welcoming Terps, and take your first step together.</p><button class="secondary" onclick="document.getElementById('search').focus()">Find your first experience</button></section><h2>Explore activities</h2><div class="filters"><input id="search" type="search" placeholder="Search activities or interests" value="${esc(query)}" oninput="filter('query',this.value)"><select aria-label="Category" onchange="filter('cat',this.value)">${options(['All','Fitness','Creative','Learning','Outdoors'],cat)}</select><select aria-label="Day" onchange="filter('day',this.value)">${options(['All','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],day)}</select><select aria-label="Group size" onchange="filter('mode',this.value)">${options(['All','Solo','1-on-1','Small group'],mode)}</select></div><div id="results" class="grid">${results()}</div>`}else if(page==='Details'&&e){let r=state.requests.find(r=>r.id===e.id&&r.user===role);app.innerHTML=`<button class="secondary" onclick="go('Explore')">← Explore</button><h1>${esc(e.title)}</h1><div class="grid"><section class="card"><div class="art">${e.icon}</div><h2>What to expect</h2><p>${esc(e.desc)}</p><p>📅 ${esc(e.time)} · ${esc(e.hour)}<br>📍 ${esc(e.place)}<br>👥 ${esc(e.mode)} · Capacity ${e.cap}</p><p>${state.requests.filter(r=>r.id===e.id&&r.status==='Accepted').length} confirmed participants</p><div class="notice">Meet in a public campus location. You can ask questions before committing.</div>${e.host===role?'You are hosting this activity.':r?`<p>Request: ${r.status}</p><button onclick="chat(${e.id})">Message host</button>`:`<button onclick="request(${e.id})">${e.mode==='Solo'?'Save my plan':'Request to join'}</button> <button class="secondary" onclick="chat(${e.id})">Ask a question</button>`}</section><aside class="card"><h2>Meet your host</h2><div class="line"><div class="avatar">${esc(e.host[0])}</div><strong>${esc(e.host)}</strong></div><span class="tag">✓ Demo student verification</span><p>${e.host==='Iris'?'Senior · Information Science · 15 years of Barre experience':'Campus peer guide (sample profile)'}</p><button onclick="profile(ev(${e.id}).host)">View profile</button><p><button class="secondary" onclick="report(ev(${e.id}).host)">Report concern</button></p></aside></div>`}else if(page==='Find a buddy'){app.innerHTML=`<h1>Find your people.</h1><p>Connect with peers who share your interests.</p><div class="grid">${['Iris','Maya','Alex','Daniel'].filter(n=>n!==role).map(n=>`<div class="card"><div class="avatar">${n[0]}</div><h3>${n}</h3><span class="tag">Demo verified</span><p>${n==='Iris'?'Barre · Fitness · Mentor':n==='Daniel'?'Freshman · CS · Exploring':n==='Maya'?'Photography · Creative':'Coding · Learning'}</p><button onclick="profile('${n}')">View profile</button></div>`).join('')}</div>`}else if(page==='Profile'){let n=selected;app.innerHTML=`<button class="secondary" onclick="go('Find a buddy')">← People</button><h1>${esc(n)}</h1><section class="card"><div class="avatar">${esc(n[0])}</div><span class="tag">✓ Demo verified UMD student</span><p>${n==='Iris'?'Senior · Information Science · Maryland. I have practiced Barre for 15 years and would love to share beginner tips.':n==='Daniel'?'Freshman · Computer Science · Michigan. Looking to meet new people and try new hobbies.':'Sample peer interested in sharing hobbies.'}</p><button class="secondary" onclick="report(selected)">Report profile</button></section><h2>Hosted activities</h2><div class="grid">${state.events.filter(e=>e.host===n).map(card).join('')||'No hosted activities yet.'}</div>`}else if(page==='My activities'){app.innerHTML=`<h1>My activities</h1><h2>My requests</h2>${state.requests.filter(r=>r.user===role).map(r=>`<div class="card"><h3>${esc(ev(r.id)?.title)}</h3><span class="tag">${r.status}</span><div class="line"><button onclick="chat(${r.id})">Messages</button>${r.status!=='Cancelled'?`<button class="secondary" onclick="status(${r.id},role,'Cancelled')">Cancel request</button>`:''}</div></div>`).join('')||'<p>No requests yet. Explore to get started.</p>'}<h2>Saved activities</h2><div class="grid">${state.events.filter(e=>state.saved.includes(role+':'+e.id)).map(card).join('')||'No saved activities yet.'}</div>`}else if(page==='Host dashboard'){app.innerHTML=`<h1>Welcome, ${role}.</h1><button onclick="go('Create activity')">+ Create an activity</button><h2>Join requests</h2>${state.requests.filter(r=>ev(r.id)?.host===role).map(r=>`<div class="card"><h3>${esc(r.user)} wants to join</h3><p>${esc(ev(r.id).title)} · ${r.status}</p><div class="line"><button onclick="profile('${r.user}')">View student</button>${r.status==='Pending'?`<button onclick="status(${r.id},'${r.user}','Accepted')">Accept</button><button class="secondary" onclick="status(${r.id},'${r.user}','Declined')">Decline</button>`:''}<button class="secondary" onclick="chat(${r.id})">Messages</button></div></div>`).join('')||'<p>No join requests yet. Switch to Daniel and request to join an activity.</p>'}<h2>Your activities</h2><div class="grid">${state.events.filter(e=>e.host===role).map(card).join('')}</div>`}else if(page==='Create activity'){app.innerHTML=`<h1>Share your experience.</h1><form class="card" onsubmit="create(event)"><label for="title">Activity name</label><input id="title" name="title" required placeholder="Beginner Barre meetup"><label>Category<select name="cat">${options(['Fitness','Creative','Learning','Outdoors'],'Fitness')}</select></label><label>Day<select name="day">${options(['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],'Thursday')}</select></label><label>Time<input name="hour" required placeholder="4:00 PM"></label><label>Public meeting location<input name="place" required placeholder="Campus building lobby"></label><label>Participation style<select name="mode">${options(['Solo','1-on-1','Small group'],'Small group')}</select></label><label>Capacity<input type="number" name="cap" min="1" max="30" value="5" required></label><label>What should first timers expect?<textarea name="desc" required></textarea></label><button>Publish activity</button></form>`}else if(page==='Messages'){let ids=[...new Set([...state.requests.filter(r=>r.user===role||ev(r.id)?.host===role).map(r=>r.id),...state.messages.filter(m=>m.from===role||ev(m.id)?.host===role).map(m=>m.id)])];app.innerHTML=`<h1>Messages</h1><div class="line">${ids.map(id=>`<button class="secondary" onclick="chat(${id})">${esc(ev(id)?.title)}</button>`).join('')}</div>${e&&(ids.includes(e.id)||e.host!==role)?`<section class="card"><h3>${esc(e.title)}</h3><p class="muted">${role===e.host?'Participant conversation':'Chat with '+esc(e.host)} · Demo messages only</p>${state.messages.filter(m=>m.id===e.id).map(m=>`<div class="bubble ${m.from===role?'mine':''}"><small style="color:inherit">${esc(m.from)}</small><br>${esc(m.text)}</div>`).join('')||'<p>Start with a friendly question: What should I bring?</p>'}<form onsubmit="send(event)"><label>Message<input name="message" required placeholder="Hi! Is this suitable for beginners?"></label><button>Send message</button></form></section>`:'<p>Choose a conversation or ask a host a question from an activity page.</p>'}`}}
render();</script></body></html>
